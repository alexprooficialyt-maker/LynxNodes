workflows:
  ios-release:
    name: Compilar IPA LynxNodes
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Compilar archivo Xcode (.xcarchive) sin firma
        script: |
          xcodebuild archive \
            -project LynxNodes.xcodeproj \
            -scheme LynxNodes \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LynxNodes.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Generar paquete .ipa
        script: |
          mkdir -p build/Payload
          cp -r build/LynxNodes.xcarchive/Products/Applications/LynxNodes.app build/Payload/
          cd build
          zip -qr LynxNodes.ipa Payload
          ls -lh LynxNodes.ipa

    artifacts:
      - build/LynxNodes.ipa

    publishing:
      email:
        recipients:
          - alexprooficialyt@gmail.com
        notify:
          failure: false
          success: true
