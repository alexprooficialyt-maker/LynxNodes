workflows:
  ios-build:
    name: SmartBot — Release IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.lynxnodes.app"
        APP_NAME: "LynxNodes"
        XCODE_PROJECT: "LynxNodes.xcodeproj"
        XCODE_SCHEME: "LynxNodes"

    scripts:
      - name: Setup Tools
        script: |
          which xcodegen || brew install xcodegen

      - name: Generate Xcode Project
        script: |
          cd $CM_BUILD_DIR
          xcodegen generate

      - name: Build Unsigned App
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LynxNodes.app Payload/
          zip -qr SmartBot.ipa Payload
          cp SmartBot.ipa LynxNodes.ipa
          rm -rf Payload

    artifacts:
      - SmartBot.ipa
      - LynxNodes.ipa
