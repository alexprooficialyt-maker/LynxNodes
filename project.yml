name: LynxNodes
options:
  bundleIdPrefix: com.lynxnodes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.lynxnodes.app
    PRODUCT_NAME: LynxNodes
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    INFOPLIST_KEY_NSFaceIDUsageDescription: "LynxNodes utiliza Face ID para proteger el acceso a tus servidores de Pterodactyl."

targets:
  LynxNodes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Components
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSFaceIDUsageDescription: "LynxNodes utiliza Face ID para proteger el acceso a tus servidores de Pterodactyl."
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: LynxNodes
        CFBundleDisplayName: "LynxNodes"
        CFBundleIdentifier: com.lynxnodes.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen:
          UIColorName: "AccentColor"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSFaceIDUsageDescription: "LynxNodes utiliza Face ID para proteger el acceso a tus servidores de Pterodactyl."
